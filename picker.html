<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Quick Search File — Google Drive Picker</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, system-ui, sans-serif; }
    #status { display: flex; align-items: center; justify-content: center; height: 100%;
              color: #666; font-size: 15px; text-align: center; padding: 24px; }
    .picker-dialog { z-index: 100000 !important; }
  </style>
</head>
<body>
  <div id="status">Loading Google Drive…</div>
  <script>
    // Restricted to https://quicksearchfile.com/* in Google Cloud Console.
    var API_KEY = "AIzaSyCic4o7AZ2CXMijTtS5udRO5f0PoI6E57o";
    var APP_SCHEME = "quicksearchfile";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    var oauthToken = qs("token");
    var appId = qs("appId");        // Google Cloud project number
    var statusEl = document.getElementById("status");

    function returnToApp(path) {
      window.location.href = APP_SCHEME + "://" + path;
    }

    function fail(reason) {
      statusEl.textContent = "Could not open Google Drive (" + reason + ").";
      returnToApp("error?reason=" + encodeURIComponent(reason));
    }

    var pickerShown = false;

    // Safety net: if the Picker never renders (e.g. api.js blocked, cookie/network issue),
    // don't hang the ASWebAuthenticationSession forever — bounce back to the app with an error.
    setTimeout(function () {
      if (!pickerShown) { fail("picker_timeout"); }
    }, 25000);

    function onApiLoad() {
      gapi.load("picker", { callback: onPickerLoad });
    }

    function onPickerLoad() {
      if (!oauthToken) { fail("no_token"); return; }
      try {
        var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false)
          .setMode(google.picker.DocsViewMode.LIST);

        var builder = new google.picker.PickerBuilder()
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
          .enableFeature(google.picker.Feature.NAV_HIDDEN)
          .setOAuthToken(oauthToken)
          .setDeveloperKey(API_KEY)
          .setOrigin(window.location.protocol + "//" + window.location.host)
          .addView(view)
          .setTitle("Select files to index")
          .setCallback(pickerCallback);

        if (appId) { builder.setAppId(appId); }

        builder.build().setVisible(true);
        pickerShown = true;
        statusEl.textContent = "";
      } catch (e) {
        fail("build_failed");
      }
    }

    function pickerCallback(data) {
      var action = data[google.picker.Response.ACTION];
      if (action === google.picker.Action.PICKED) {
        var docs = data[google.picker.Response.DOCUMENTS] || [];
        var ids = docs.map(function (d) { return d[google.picker.Document.ID]; });
        returnToApp("picked?ids=" + encodeURIComponent(ids.join(",")));
      } else if (action === google.picker.Action.CANCEL) {
        returnToApp("cancelled");
      }
    }

    window.onApiLoad = onApiLoad;
  </script>
  <script async defer src="https://apis.google.com/js/api.js?onload=onApiLoad"></script>
</body>
</html>
