<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Quick Search File - Google Drive Picker</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, system-ui, sans-serif; }
    #status { display: flex; align-items: center; justify-content: center; height: 100%;
              color: #666; font-size: 15px; text-align: center; padding: 24px; }
    .picker-dialog { z-index: 100000 !important; }
  </style>
</head>
<body>
  <div id="status">Loading Google Drive...</div>
  <script>
    var DEFAULT_APP_SCHEME = "quicksearchfile";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    var oauthToken = qs("token");
    var appId = qs("appId");
    var developerKey = qs("developerKey");
    var callbackBase = qs("callbackBase");
    var appScheme = qs("callbackScheme") || DEFAULT_APP_SCHEME;
    var statusEl = document.getElementById("status");

    function callbackURL(path) {
      if (callbackBase) {
        return callbackBase.replace(/\/+$/, "") + "/" + path;
      }
      return appScheme + "://" + path;
    }

    function fallbackCallbackURL(path) {
      return appScheme + "://" + path;
    }

    function returnToApp(path) {
      var target = callbackURL(path);
      window.location.href = target;

      if (callbackBase) {
        setTimeout(function () {
          window.location.href = fallbackCallbackURL(path);
        }, 1500);
      }
    }

    function fail(reason) {
      statusEl.textContent = "Could not open Google Drive (" + reason + ").";
      returnToApp("error?reason=" + encodeURIComponent(reason));
    }

    var pickerShown = false;

    setTimeout(function () {
      if (!pickerShown) { fail("picker_timeout"); }
    }, 25000);

    function onApiLoad() {
      gapi.load("picker", { callback: onPickerLoad });
    }

    function onPickerLoad() {
      if (!oauthToken) { fail("no_token"); return; }
      try {
        var view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(true)
          .setMode(google.picker.DocsViewMode.LIST);

        var builder = new google.picker.PickerBuilder()
          .setOAuthToken(oauthToken)
          .setOrigin(window.location.protocol + "//" + window.location.host)
          .addView(view)
          .setTitle("Select folder to index")
          .setCallback(pickerCallback);

        if (appId) { builder.setAppId(appId); }
        if (developerKey) { builder.setDeveloperKey(developerKey); }

        builder.build().setVisible(true);
        pickerShown = true;
        statusEl.textContent = "";
      } catch (e) {
        fail("build_failed");
      }
    }

    function pickerCallback(data) {
      var action = data[google.picker.Response.ACTION];
      if (action === google.picker.Action.PICKED) {
        var docs = data[google.picker.Response.DOCUMENTS] || [];
        var folder = docs[0];
        if (!folder) {
          fail("no_folder");
          return;
        }

        var id = folder[google.picker.Document.ID] || "";
        var name = folder[google.picker.Document.NAME] || "";
        var url = folder[google.picker.Document.URL] || "";
        returnToApp(
          "picked?folderId=" + encodeURIComponent(id) +
          "&name=" + encodeURIComponent(name) +
          "&url=" + encodeURIComponent(url)
        );
      } else if (action === google.picker.Action.CANCEL) {
        returnToApp("cancelled");
      }
    }

    window.onApiLoad = onApiLoad;
  </script>
  <script async defer src="https://apis.google.com/js/api.js?onload=onApiLoad"></script>
</body>
</html>
